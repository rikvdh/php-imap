name: PHPStan

on:
  pull_request:
  push:

jobs:
  ubuntu:
    name: PHPStan

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', 8.1, 8.2, 8.3, 8.4]

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, msgpack
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command:  |
            composer update --prefer-dist --no-progress --prefer-dist

      - name: Run phpstan
        run: vendor/bin/phpstan
